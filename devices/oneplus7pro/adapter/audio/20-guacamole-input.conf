# Internal microphone through guacamole_mic. nofail keeps a capture failure
# from stopping PipeWire, and with it the speaker sink.
context.objects = [
    { factory = adapter
      args = {
        factory.name = api.alsa.pcm.source
        node.name = guacamole-mic
        node.description = "Internal microphone"
        media.class = "Audio/Source"
        api.alsa.path = "guacamole_mic"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 1024
        api.alsa.period-num = 3
        audio.format = S16_LE
        audio.rate = 48000
        audio.channels = 1
        audio.position = [ MONO ]
        node.pause-on-idle = true
        session.suspend-timeout-seconds = 2
      }
      flags = [ nofail ]
    }
]
