# The manually described, attenuated sink and the described microphone source
# are the only validated routes. Avoid auto-created ALSA profiles that bypass
# the output cap or open unrouted front ends.
# Bluetooth audio needs the bluez monitor: it registers PipeWire's A2DP/HFP
# endpoints with bluetoothd, without which headphones pair but every audio
# connection fails with "Protocol not available". Optional, because bluetoothd
# may start after WirePlumber or not at all; there is no logind seat to follow
# in this root session.
# Cameras come from libcamera (the IMX586 through its software ISP, USB
# webcams through uvcvideo). The V4L2 monitor would list each raw CAMSS video
# node as a separate, unusable "Qualcomm Camera Subsystem" camera.
wireplumber.profiles = {
    main = {
        monitor.alsa = disabled
        monitor.bluez = optional
        monitor.bluez.seat-monitoring = disabled
        monitor.v4l2 = disabled
        monitor.libcamera = optional
    }
}
