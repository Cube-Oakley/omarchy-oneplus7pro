# Internal microphone: AMIC4, the stock handset mic, on the MultiMedia2 front
# end. The board session helper sets the capture route and gains.
# @CAPTURE_DEVICE@ is discovered from /proc/asound/pcm by the board session helper.
pcm.guacamole_mic {
    type plug
    slave {
        pcm "hw:Pro,@CAPTURE_DEVICE@"
        format S16_LE
        rate 48000
        channels 1
    }
}
