# Speaker output: a processing sink in front of the hardware sink, in the
# spirit of the stock Dolby tuning. The ALSA cap (alsa-quiet.conf) is the hard
# safety bound; everything here only shapes the signal below it.
#
# The bottom speaker is 13 dB down at 500 Hz and 29 dB down at 300 Hz relative
# to 1 kHz, so real bass cannot be played. Per channel:
#   - a 4th-order 400 Hz high-pass keeps unplayable bass off the cone;
#   - virtual bass: the band below 250 Hz becomes a square wave that follows the
#     bass envelope (sign(b) x |b| smoothed), and its 450-1500 Hz harmonics are
#     mixed back so the ear infers the missing fundamental. It is OFF (mixer
#     "Gain 2" = 0): on real music the square wave turned chords into audible
#     fuzz. Raise it live with pw-cli for A/B tests until a gentler generator
#     replaces it;
# then, on both channels together, an RMS compressor with makeup gain (a volume
# leveler) and a look-ahead limiter at -1 dBFS. Needs swh-plugins.
# Measurements: docs/speakers-20260922.md.
context.objects = [
    { factory = adapter
      args = {
        factory.name = api.alsa.pcm.sink
        node.name = guacamole-speakers-hw
        node.description = "Internal speakers (unprocessed)"
        media.class = "Audio/Sink"
        # Below the processing sink, so applications default to that one.
        priority.session = 800
        priority.driver = 800
        api.alsa.path = "guacamole_quiet"
        api.alsa.disable-mmap = true
        # The ADSP moves the pointer a period at a time, so PipeWire treats the
        # PCM as batch: it halves the period to 512 frames and keeps an extra
        # period queued. With 3 periods the 1536-frame buffer could not hold
        # that fill, starts fell into XRUN loops and playback ticked. 8 periods
        # (the hardware maximum) leave room for a quantum plus 1024 frames.
        api.alsa.period-size = 1024
        api.alsa.period-num = 8
        api.alsa.headroom = 1024
        audio.format = S24_32LE
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        node.pause-on-idle = true
        session.suspend-timeout-seconds = 2
      }
    }
]

context.modules = [
    { name = libpipewire-module-filter-chain
      flags = [ nofail ]
      args = {
        node.description = "Internal speakers"
        media.name = "Internal speakers"
        filter.graph = {
          nodes = [
            { type = builtin name = in_l label = copy }
            { type = builtin name = hp1_l label = bq_highpass control = { "Freq" = 400.0 "Q" = 0.5412 } }
            { type = builtin name = hp2_l label = bq_highpass control = { "Freq" = 400.0 "Q" = 1.3066 } }
            { type = builtin name = bass1_l label = bq_lowpass control = { "Freq" = 250.0 "Q" = 0.5412 } }
            { type = builtin name = bass2_l label = bq_lowpass control = { "Freq" = 250.0 "Q" = 1.3066 } }
            { type = builtin name = rect_l label = abs }
            { type = builtin name = env_l label = bq_lowpass control = { "Freq" = 20.0 "Q" = 0.7071 } }
            { type = builtin name = eps_l label = linear control = { "Mult" = 1.0 "Add" = 0.0001 } }
            { type = builtin name = inv_l label = recip }
            { type = builtin name = square_l label = mult }
            { type = builtin name = harm1_l label = bq_highpass control = { "Freq" = 450.0 "Q" = 0.5412 } }
            { type = builtin name = harm2_l label = bq_highpass control = { "Freq" = 450.0 "Q" = 1.3066 } }
            { type = builtin name = harm3_l label = bq_lowpass control = { "Freq" = 1500.0 "Q" = 0.7071 } }
            { type = builtin name = mix_l label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }

            { type = builtin name = in_r label = copy }
            { type = builtin name = hp1_r label = bq_highpass control = { "Freq" = 400.0 "Q" = 0.5412 } }
            { type = builtin name = hp2_r label = bq_highpass control = { "Freq" = 400.0 "Q" = 1.3066 } }
            { type = builtin name = bass1_r label = bq_lowpass control = { "Freq" = 250.0 "Q" = 0.5412 } }
            { type = builtin name = bass2_r label = bq_lowpass control = { "Freq" = 250.0 "Q" = 1.3066 } }
            { type = builtin name = rect_r label = abs }
            { type = builtin name = env_r label = bq_lowpass control = { "Freq" = 20.0 "Q" = 0.7071 } }
            { type = builtin name = eps_r label = linear control = { "Mult" = 1.0 "Add" = 0.0001 } }
            { type = builtin name = inv_r label = recip }
            { type = builtin name = square_r label = mult }
            { type = builtin name = harm1_r label = bq_highpass control = { "Freq" = 450.0 "Q" = 0.5412 } }
            { type = builtin name = harm2_r label = bq_highpass control = { "Freq" = 450.0 "Q" = 1.3066 } }
            { type = builtin name = harm3_r label = bq_lowpass control = { "Freq" = 1500.0 "Q" = 0.7071 } }
            { type = builtin name = mix_r label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }

            { type = ladspa name = comp plugin = sc4_1882 label = sc4
              control = { "RMS/peak" = 0.0 "Attack time (ms)" = 20.0 "Release time (ms)" = 250.0
                          "Threshold level (dB)" = -24.0 "Ratio (1:n)" = 3.0 "Knee radius (dB)" = 6.0
                          "Makeup gain (dB)" = 10.0 } }
            { type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
              control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -1.0 "Release time (s)" = 0.08 } }
          ]
          links = [
            { output = "in_l:Out" input = "hp1_l:In" }
            { output = "hp1_l:Out" input = "hp2_l:In" }
            { output = "hp2_l:Out" input = "mix_l:In 1" }
            { output = "in_l:Out" input = "bass1_l:In" }
            { output = "bass1_l:Out" input = "bass2_l:In" }
            { output = "bass2_l:Out" input = "rect_l:In" }
            { output = "rect_l:Out" input = "env_l:In" }
            { output = "rect_l:Out" input = "eps_l:In" }
            { output = "eps_l:Out" input = "inv_l:In" }
            { output = "bass2_l:Out" input = "square_l:In 1" }
            { output = "inv_l:Out" input = "square_l:In 2" }
            { output = "env_l:Out" input = "square_l:In 3" }
            { output = "square_l:Out" input = "harm1_l:In" }
            { output = "harm1_l:Out" input = "harm2_l:In" }
            { output = "harm2_l:Out" input = "harm3_l:In" }
            { output = "harm3_l:Out" input = "mix_l:In 2" }

            { output = "in_r:Out" input = "hp1_r:In" }
            { output = "hp1_r:Out" input = "hp2_r:In" }
            { output = "hp2_r:Out" input = "mix_r:In 1" }
            { output = "in_r:Out" input = "bass1_r:In" }
            { output = "bass1_r:Out" input = "bass2_r:In" }
            { output = "bass2_r:Out" input = "rect_r:In" }
            { output = "rect_r:Out" input = "env_r:In" }
            { output = "rect_r:Out" input = "eps_r:In" }
            { output = "eps_r:Out" input = "inv_r:In" }
            { output = "bass2_r:Out" input = "square_r:In 1" }
            { output = "inv_r:Out" input = "square_r:In 2" }
            { output = "env_r:Out" input = "square_r:In 3" }
            { output = "square_r:Out" input = "harm1_r:In" }
            { output = "harm1_r:Out" input = "harm2_r:In" }
            { output = "harm2_r:Out" input = "harm3_r:In" }
            { output = "harm3_r:Out" input = "mix_r:In 2" }

            { output = "mix_l:Out" input = "comp:Left input" }
            { output = "mix_r:Out" input = "comp:Right input" }
            { output = "comp:Left output" input = "lim:Input 1" }
            { output = "comp:Right output" input = "lim:Input 2" }
          ]
          inputs = [ "in_l:In" "in_r:In" ]
          outputs = [ "lim:Output 1" "lim:Output 2" ]
        }
        audio.channels = 2
        audio.position = [ FL FR ]
        capture.props = {
          node.name = "guacamole-speakers"
          media.class = "Audio/Sink"
          # Stay the default sink next to the shell's volume-group loopback sinks.
          priority.session = 1000
          priority.driver = 1000
        }
        playback.props = {
          node.name = "guacamole-speakers-filter-out"
          target.object = "guacamole-speakers-hw"
          node.passive = true
          # An unused role, so the volume-group policy never routes this stream.
          media.role = "Loopback"
        }
      }
    }
]
