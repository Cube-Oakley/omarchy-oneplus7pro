# Experimental output: fixed -36 dB attenuation after conversion to integer PCM.
# This bounds even a full-scale application signal while DSP speaker protection
# is unfinished. UI volume remains an additional software attenuation.
# @PCM_DEVICE@ is discovered from /proc/asound/pcm by the board session helper.
pcm.guacamole_quiet {
    type plug
    slave {
        format S24_LE
        rate 48000
        channels 2
        pcm {
            type route
            slave {
                pcm "hw:Pro,@PCM_DEVICE@"
                format S24_LE
                channels 2
            }
            ttable.0.0 0.0158489319
            ttable.1.1 0.0158489319
        }
    }
}
