# Speaker output cap: a fixed mono mix with a per-speaker limit, applied after
# conversion to integer PCM. This bounds even a full-scale application signal
# while DSP speaker protection is unfinished. UI volume remains an additional
# software attenuation; PipeWire's 400 Hz high-pass sits above this.
#
# The hardware side must stay S16_LE: the ADSP plays S24_LE samples 48 dB low.
# Limits are where a 1 kHz tone reaches about 5% distortion at the mics
# (docs/speakers-20260922.md): the bottom speaker (right, slot 1) at -18 dBFS
# and the earpiece (left, slot 0) at -42 dBFS. The earpiece is then about 17 dB
# quieter, so both play (L+R)/2 and a hard-panned source is never lost.
# @PCM_DEVICE@ is discovered from /proc/asound/pcm by the board session helper.
pcm.guacamole_quiet {
    type plug
    slave {
        format S24_LE
        rate 48000
        channels 2
        pcm {
            type route
            slave {
                pcm "hw:Pro,@PCM_DEVICE@"
                format S16_LE
                channels 2
            }
            # ttable.IN.OUT: 0.5 x -42 dB to the earpiece, 0.5 x -18 dB to the bottom.
            ttable.0.0 0.0039716412
            ttable.1.0 0.0039716412
            ttable.0.1 0.0629462706
            ttable.1.1 0.0629462706
        }
    }
}
