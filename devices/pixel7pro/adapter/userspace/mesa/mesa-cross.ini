[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'
[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
[properties]
sys_root = '@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot'
pkg_config_libdir = ['@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot/usr/lib/pkgconfig', '@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot/usr/share/pkgconfig']
needs_exe_wrapper = true
[built-in options]
c_args = ['--sysroot=@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot']
cpp_args = ['--sysroot=@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot']
c_link_args = ['--sysroot=@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot', '-L@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot/usr/lib', '-Wl,-rpath-link,@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot/usr/lib']
cpp_link_args = ['--sysroot=@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot', '-L@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot/usr/lib', '-Wl,-rpath-link,@PIXEL_ROOT@/out/checkpoints/20260925-gpu-v15/sysroot/usr/lib']
