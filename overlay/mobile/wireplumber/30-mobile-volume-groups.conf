# Android-style volume groups: one role loopback sink per group, each with its
# own volume. Streams reach a group by media.role; streams without a role count
# as media. WirePlumber publishes the group the volume keys should control as
# current.role-based.volume.control: the highest-priority group that is playing,
# otherwise media. Based on WirePlumber's media-role-nodes.conf example.

wireplumber.profiles = {
  main = {
    policy.linking.role-based.loopbacks = required
  }
}

wireplumber.settings = {
  node.stream.default-media-role = "Multimedia"
}

wireplumber.components.rules = [
  {
    matches = [
      {
        provides = "~loopback.sink.*"
      }
    ]
    actions = {
      merge = {
        arguments = {
          capture.props = {
            policy.role-based.target = true
            audio.position = [ FL, FR ]
            media.class = Audio/Sink
          }
          playback.props = {
            # Let the real sink suspend while no stream uses this group.
            node.passive = true
            # An unused role, so group loopbacks never link into each other.
            media.role = "Loopback"
          }
        }
        requires = [ support.client-context ]
      }
    }
  }
]

wireplumber.components = [
  {
    type = virtual, provides = policy.linking.role-based.loopbacks
    requires = [ loopback.sink.role.multimedia
                 loopback.sink.role.notification
                 loopback.sink.role.alarm
                 loopback.sink.role.communication ]
  }
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.multimedia"
      node.description = "Media"
      capture.props = {
        device.intended-roles = [ "Music", "Movie", "Game", "Multimedia" ]
        policy.role-based.priority = 10
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
    }
    provides = loopback.sink.role.multimedia
  }
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.notification"
      node.description = "Ring & notifications"
      capture.props = {
        device.intended-roles = [ "Notification", "Ringtone" ]
        policy.role-based.priority = 20
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "duck"
      }
    }
    provides = loopback.sink.role.notification
  }
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.alarm"
      node.description = "Alarms"
      capture.props = {
        device.intended-roles = [ "Alarm", "Alert" ]
        policy.role-based.priority = 40
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "duck"
      }
    }
    provides = loopback.sink.role.alarm
  }
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.communication"
      node.description = "Calls"
      capture.props = {
        device.intended-roles = [ "Communication", "Phone" ]
        policy.role-based.priority = 50
        policy.role-based.action.same-priority = "mix"
        # Pause media and other lower groups for the length of a call.
        policy.role-based.action.lower-priority = "cork"
      }
    }
    provides = loopback.sink.role.communication
  }
]
